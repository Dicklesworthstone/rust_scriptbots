[package]
name = "scriptbots-app"
version = "0.1.0"
edition = "2024"
default-run = "scriptbots-app"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
asupersync = { workspace = true }
axum = { version = "0.8.0", features = ["macros", "json", "ws"] }
async-trait = "0.1"
blake3 = { workspace = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
fastmcp-rust = { workspace = true }
ratatui = { version = "0.30.0-alpha.5" }
# `default-features = false` is load-bearing: reqwest's default `default-tls` pulls
# native-tls -> openssl-sys, so asking for rustls-tls alone still linked OpenSSL and
# broke every build on a host without OpenSSL development headers (and every
# cross-compile, since openssl-sys cannot configure through pkg-config). charset and
# http2 are re-stated explicitly because they are the other defaults we actually use.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
] }
scriptbots-brain = { path = "../scriptbots-brain" }
scriptbots-brain-ml = { path = "../scriptbots-brain-ml", optional = true }
scriptbots-brain-neuro = { path = "../scriptbots-brain-neuro", optional = true }
scriptbots-core = { path = "../scriptbots-core" }
scriptbots-render = { path = "../scriptbots-render", optional = true }
scriptbots-runtime = { path = "../scriptbots-runtime" }
# bd-ydmr/bd-0dmc: the archipelago determinism gate and its CLI surface build
# BOUNDED Rayon pools so they can compare science across real thread counts. They
# must live in this crate because scriptbots-runtime takes core with
# default-features = false, leaving `parallel` off there and any such check
# vacuous.
rayon = { workspace = true }
scriptbots-storage = { path = "../scriptbots-storage" }
scriptbots-bevy = { path = "../scriptbots-bevy", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
serde_path_to_error = "0.1"
smallvec = "1.13"
futures-util = "0.3.31"
tokio-stream = "0.1.16"
slotmap = { workspace = true }
supports-color = "3.0.2"
thiserror = { workspace = true }
rand = { workspace = true }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "5.4.0", features = ["macros", "axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
crossterm = "0.27"
owo-colors = "4.3.0"
csv = { workspace = true }
ron = "0.8"
toml = "0.8"
mimalloc = { version = "0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"

[features]
# Off by default so `cargo test` cannot reach the network or spend real tokens.
llm-anthropic = ["reqwest/blocking"]
default = ["ml", "neuro", "fast-alloc"]
gui = ["dep:scriptbots-render"]
ml = ["scriptbots-brain-ml"]
brain-ft = ["ml", "scriptbots-brain-ml/brain-ft"]
neuro = ["scriptbots-brain-neuro"]
fast-alloc = ["dep:mimalloc"]
bevy_render = ["dep:scriptbots-bevy"]

[dev-dependencies]
rand = { workspace = true }
tempfile = "3.13"
serial_test = "3.0"
