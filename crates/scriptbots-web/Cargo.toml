[package]
name = "scriptbots-web"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }
rand = { workspace = true }
scriptbots-core = { path = "../scriptbots-core", default-features = false, features = ["batch-brains"] }
scriptbots-brain = { path = "../scriptbots-brain", default-features = false, features = ["mlp"] }
scriptbots-runtime = { path = "../scriptbots-runtime", default-features = false }
postcard = { workspace = true }
js-sys = "0.3.73"

[features]
# Enables the cross-architecture parity test that compares wasm execution against
# the committed native-generated fixture (tests/fixtures/native_parity_v1.postcard).
# Off by default only because the fixture file must exist before the test can be
# compiled (include_bytes!); enable once the generator has produced and committed it.
native-parity-fixture = []

[dev-dependencies]
wasm-bindgen-test = "0.3.54"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]
