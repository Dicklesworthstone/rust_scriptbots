[package]
name = "scriptbots-world-gfx"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "High-performance wgpu-based world renderer for ScriptBots with offscreen readback for GPUI composition."

[lib]
name = "scriptbots_world_gfx"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
tracing = { workspace = true }
pollster = "0.4"
scriptbots-core = { path = "../scriptbots-core" }

[features]
default = []
compute_binning = []
perf_counters = []

# Native backend per platform (bd-2z0.7.11): Metal on macOS, DX12 on Windows,
# Vulkan on Linux. Portability layers (e.g. MoltenVK) must never enter the native
# product by default; they remain explicit runtime diagnostics (WGPU_BACKEND).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "wgsl"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "wayland", "x11"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
