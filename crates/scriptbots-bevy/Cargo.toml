[package]
name = "scriptbots-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
bevy = { version = "0.17" }
bevy_mesh = { version = "0.17" }
bevy_post_process = { version = "0.17" }
blake3 = { workspace = true }
scriptbots-core = { path = "../scriptbots-core" }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
slotmap = { workspace = true }

# Direct adapter probing for the capability report; version-locked to bevy's own wgpu
# line so the probe and the renderer share one wgpu universe (bevy 0.17 uses wgpu 26).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "26", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "26", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "26", default-features = false, features = ["vulkan", "wgsl"] }

[dev-dependencies]
# Same naga 26 already in the lockfile as wgpu 26's dependency: WGSL source
# validation in particle/creature tests without a second naga universe.
naga = { version = "=26.0.0", default-features = false, features = ["wgsl-in"] }
serde_json = { workspace = true }
