[package]
name = "scriptbots-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
# bevy 0.17.3's default features, verbatim, with zstd_rust swapped for zstd_c. The
# pure-Rust ruzstd backend has a decompression-bomb advisory (RUSTSEC-2026-0344,
# patched >= 0.9.1) that bevy_image 0.17's `ruzstd = "0.8"` pin cannot reach; the C
# zstd backend is unaffected. smaa_luts still needs zstd, so the backend is swapped,
# not dropped. bevy is opt-in only (scriptbots-app `bevy_render`), not in the shipped build.
# jpeg is not a bevy default; it is enabled so the authored groundcover images can load.
bevy = { version = "0.17", default-features = false, features = ["std", "async_executor", "android-game-activity", "android_shared_stdcxx", "animation", "bevy_asset", "bevy_audio", "bevy_color", "bevy_core_pipeline", "bevy_post_process", "bevy_anti_alias", "bevy_gilrs", "bevy_gizmos", "bevy_gltf", "bevy_input_focus", "bevy_log", "bevy_mesh_picking_backend", "bevy_pbr", "bevy_picking", "bevy_render", "bevy_scene", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_sprite", "bevy_sprite_picking_backend", "bevy_sprite_render", "bevy_state", "bevy_text", "bevy_ui", "bevy_ui_picking_backend", "bevy_ui_render", "bevy_window", "bevy_winit", "custom_cursor", "default_font", "hdr", "ktx2", "multi_threaded", "png", "reflect_auto_register", "smaa_luts", "sysinfo_plugin", "tonemapping_luts", "vorbis", "webgl2", "x11", "wayland", "debug", "zstd_c", "jpeg"] }
bevy_mesh = { version = "0.17" }
bevy_post_process = { version = "0.17" }
blake3 = { workspace = true }
scriptbots-core = { path = "../scriptbots-core" }
scriptbots-runtime = { path = "../scriptbots-runtime" }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
slotmap = { workspace = true }

# Direct adapter probing for the capability report; version-locked to bevy's own wgpu
# line so the probe and the renderer share one wgpu universe (bevy 0.17 uses wgpu 26).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "26", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "26", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "26", default-features = false, features = ["vulkan", "wgsl"] }

[dev-dependencies]
# Same naga 26 already in the lockfile as wgpu 26's dependency: WGSL source
# validation in particle/creature tests without a second naga universe.
naga = { version = "=26.0.0", default-features = false, features = ["wgsl-in"] }
serde_json = { workspace = true }
