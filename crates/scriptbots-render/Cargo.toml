[package]
name = "scriptbots-render"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
tracing = { workspace = true }
scriptbots-core = { path = "../scriptbots-core" }
scriptbots-storage = { path = "../scriptbots-storage" }
kira = { workspace = true, optional = true }
rand = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
scriptbots-world-gfx = { path = "../scriptbots-world-gfx", optional = true }
pollster = { version = "0.4", optional = true }
naga = { version = "27", features = ["termcolor"] }

[dev-dependencies]
scriptbots-brain = { path = "../scriptbots-brain" }

[features]
default = ["world_wgpu"]
audio = ["kira"]
world_wgpu = ["scriptbots-world-gfx", "pollster", "wgpu"]

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27", optional = true, default-features = false, features = ["vulkan", "wgsl"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27", optional = true, default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", optional = true, default-features = false, features = ["metal", "wgsl"] }
