[package]
name = "scriptbots-brain-ml"
version = "0.1.0"
edition = "2024"

[dependencies]
scriptbots-brain = { path = "../scriptbots-brain" }
scriptbots-core = { path = "../scriptbots-core" }
rand = { workspace = true }
blake3 = { workspace = true }
candle-core = { version = "0.8.2", optional = true }
candle-nn = { version = "0.8.2", optional = true }
tract-onnx = { version = "0.21.6", optional = true }
tch = { version = "0.18.0", optional = true }
ft-api = { workspace = true, optional = true }
ft-core = { workspace = true, optional = true }
ft-kernel-cpu = { workspace = true, optional = true }
ft-nn = { workspace = true, optional = true }
ft-optim = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }

[features]
default = []
candle = ["candle-core", "candle-nn"]
tract = ["tract-onnx"]
tch = ["dep:tch"]
brain-ft = [
    "dep:ft-api",
    "dep:ft-core",
    "dep:ft-kernel-cpu",
    "dep:ft-nn",
    "dep:ft-optim",
]
