[package]
name = "scriptbots-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["parallel", "simd_wide"]
parallel = ["dep:rayon"]
simd_wide = ["dep:wide"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
slotmap = { workspace = true }
rand = { workspace = true }
wfc = { workspace = true }
direction = { workspace = true }
rand08 = { workspace = true }
scriptbots-index = { path = "../scriptbots-index" }
rayon = { workspace = true, optional = true }
getrandom = { workspace = true }
libm = { workspace = true }
num_cpus = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
blake3 = { workspace = true }
wide = { version = "1.5.0", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom02 = { workspace = true, features = ["js"] }

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["html_reports"] }
scriptbots-brain = { path = "../scriptbots-brain", default-features = false, features = ["mlp"] }
scriptbots-brain-neuro = { path = "../scriptbots-brain-neuro", default-features = false }

[[bench]]
name = "world_bench"
harness = false
