[package]
name = "scriptbots-analytics"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Offline science layer for ScriptBots: read-only reports over finished run databases (bd-2z0.11.5). Never a dependency of the app binaries; never built for wasm."

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
scriptbots-core = { path = "../scriptbots-core", default-features = false }
scriptbots-storage = { path = "../scriptbots-storage" }
clap = { version = "4.6.1", features = ["derive", "env"] }
fp-frame = "0.2.0"
fp-groupby = "0.2.0"
fp-columnar = "0.2.0"
fp-types = "0.2.0"
fp-index = "0.2.0"
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "snap"] }
arrow = { version = "58.4.0", default-features = false, features = ["ipc"] }

[dev-dependencies]
libc = { workspace = true }
tempfile = "3.27.0"

[lints]
workspace = true

[[bin]]
name = "sb-analyze"
path = "src/bin/sb_analyze.rs"
