# No global `[build] target`. Pinning one here forced every host to cross-compile to
# Linux, so on macOS the settings below applied and the link died with
# `clang: error: invalid linker name in argument '-fuse-ld=mold'` — breaking every
# local `cargo test`/`build`/`bench` (`cargo check` survived only because it never
# links). That is also what turned an rch fail-open into a link error rather than a
# build (bd-h7v0).
#
# Nothing needs the global default. The rch workers are x86_64 Linux, so their host
# build resolves the section below automatically — cargo applies `[target.<triple>]`
# to a host build with no `--target`, so `linker`, mold, and `target-cpu=x86-64-v3`
# are all preserved there. The DSR lane never relied on it either: perf_gate.sh
# passes `--target "${HOST_TARGET}"` from `rustc -vV` (scripts/perf_gate.sh:162,192)
# and DSR sets a caller-level `CARGO_BUILD_TARGET` for its pinned Apple Silicon
# target (see ci/check_wasm_graph.sh:78).

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Z", "threads=4", 
    "-C","link-arg=-fuse-ld=mold",
    # Default to an AVX2-class baseline so CI avoids SIGILL; launch scripts add RUSTFLAGS=\"-C target-cpu=native\" for local tuning.
    "-C","target-cpu=x86-64-v3",
]

[env]
CC_x86_64_pc_windows_gnullvm = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang"
CXX_x86_64_pc_windows_gnullvm = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang++"
AR_x86_64_pc_windows_gnullvm = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/llvm-ar"
CXXFLAGS_x86_64_pc_windows_gnullvm = "-isystem /data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/x86_64-w64-mingw32/include/c++/v1"
GPUI_FXC_PATH = "/data/projects/rust_scriptbots/toolchains/windows/bin/fxc-wrapper"
RUST_TEST_THREADS = "1"

[target.x86_64-pc-windows-gnullvm]
linker = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang"
ar = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/llvm-ar"

[target.x86_64-pc-windows-gnullvm.env]
CC = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang"
CXX = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang++"
AR = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/llvm-ar"
CC_X86_64_PC_WINDOWS_GNULLVM = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang"
CXX_X86_64_PC_WINDOWS_GNULLVM = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang++"
AR_X86_64_PC_WINDOWS_GNULLVM = "/data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/bin/llvm-ar"
CXXFLAGS_X86_64_PC_WINDOWS_GNULLVM = "-isystem /data/projects/rust_scriptbots/toolchains/llvm-mingw-20251021-ucrt-ubuntu-22.04-x86_64/x86_64-w64-mingw32/include/c++/v1"

[net]
# bd-1x69: frankensqlite pins submodule legacy_sqlite_code/sqlite at sqlite object
# 450a9009, which is unreachable from any branch/tag ref on github.com/sqlite/sqlite.
# libgit2 submodule updates fetch only default refspecs, so fresh clones fail with
# "object not found" on some cargo/libgit2 builds. The git CLI retries the submodule
# fetch by exact OID, and GitHub honors fetch-by-SHA, so routing all git fetching
# through the CLI makes fresh clones work on every platform/toolchain.
git-fetch-with-cli = true

[build]
# Parallel rustc front-end (nightly). Added by build-settings sweep.
rustflags = ["-Z", "threads=4"]
