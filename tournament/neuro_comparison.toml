# Opt-in NeuroFlow / MLP architecture comparison.
# Requires scriptbots-app built with its neuro feature (enabled by default).
#
# Both spawn orders use equal founder cohorts and the same world configuration.
# The versioned NeuroFlow adapter uses the configured hidden layers and activation;
# explicitly entering this family does not depend on neuroflow.enabled.
# Four seeds and 240 ticks provide a bounded comparison, not a long-horizon claim.
#
# These architectures have different parameter capacities. The canonical
# tournament's 200-source-scalar [parameters] gate is intentionally absent from
# this separate comparison. Reports retain the exact initial genome digests.
# NeuroFlow source-scalar counts come from its validated genome topology; they
# do not claim that an unexecuted tick-zero network already recorded activity.

[tournament]
title = "NeuroFlow vs MLP bounded architecture comparison"
version = "1.0.0"
families = ["mlp", "neuro"]
seeds = [17, 29, 47, 71]
ticks = 240
cohort_size = 16
order_policy = "both_assignments"
closed = true
sense_backend = "cpu_simd"
sense_determinism = "exact"
reproducible = true

[reproducibility]
require_identical_rerun = true
max_retries = 1

[smoke]
families = ["mlp", "neuro"]
seeds = [17, 29]
ticks = 32
cohort_size = 8
order_policy = "both_assignments"
closed = true
