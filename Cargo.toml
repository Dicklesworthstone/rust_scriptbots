[workspace]
resolver = "2"
members = [
    "crates/scriptbots-core",
    "crates/scriptbots-runtime",
    "crates/scriptbots-brain",
    "crates/scriptbots-brain-ml",
    "crates/scriptbots-brain-neuro",
    "crates/scriptbots-index",
    "crates/scriptbots-storage",
    "crates/scriptbots-render",
    "crates/scriptbots-world-gfx",
    "crates/scriptbots-app",
    "crates/scriptbots-bevy",
    "crates/scriptbots-web",
    "crates/scriptbots-analytics",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
rust-version = "1.89"
authors = ["ScriptBots Team"]
description = "Evolutionary agent simulation rebuilt in modern Rust with GPUI rendering."
repository = "https://github.com/Dicklesworthstone/rust_scriptbots"

[workspace.dependencies]
anyhow = "1.0.103"
arc-swap = "1.9.2"
asupersync = { version = "=0.3.6", default-features = false }
blake3 = "1.8.5"
libc = "0.2.186"
libm = "0.2.16"
rayon = "1.12.0"
rand = { version = "0.9.0", features = ["small_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ordered-float = "4.2.0"
slotmap = { version = "1.1.1", features = ["serde"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2.17" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
num_cpus = "1.16.0"
csv = "1.2.2"
wfc = "0.10.7"
direction = "0.18.0"
rand08 = { package = "rand", version = "0.8.5" }

fsqlite = { version = "=0.1.16", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "1eec0d2669d0a7938e155b62ce8ebcd72e5bed78", default-features = false, features = ["native"] }
ft-api = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "e4c6bdd5ec629ae70b40da9314da345ade012ca7", default-features = false }
ft-core = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "e4c6bdd5ec629ae70b40da9314da345ade012ca7", default-features = false }
ft-kernel-cpu = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "e4c6bdd5ec629ae70b40da9314da345ade012ca7", default-features = false }
ft-nn = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "e4c6bdd5ec629ae70b40da9314da345ade012ca7", default-features = false }
ft-optim = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "e4c6bdd5ec629ae70b40da9314da345ade012ca7", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "5f8a7413a31769e0882357f90dc424b3962ac72d" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "5f8a7413a31769e0882357f90dc424b3962ac72d" }
kira = "0.10.1"
rstar = "0.12.2"
kiddo = "4.2.0"
neuroflow = "0.2.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2.104", features = ["serde-serialize"] }

[patch.crates-io]
# GPUI's inactive screen-capture option still puts xcb 1.7.0 in Cargo.lock.
# Keep broad lockfile audits clean with this exact upstream compatibility commit,
# which replaces xcb's vulnerable build-time quick-xml 0.30 parser with 0.41.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
incremental = false
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
split-debuginfo = "unpacked"

[profile.release-dbg]
inherits = "release"
debug = true
strip = false

[workspace.metadata.dist]
ci = ["github"]
# bd-2z0.13.6: release archives must carry the third-party notice file —
# the embedded FrankenSQLite/asupersync components' license requires its
# rider to accompany any distribution (see docs/licenses.md §3c).
include = ["THIRD-PARTY-LICENSES.md"]

[[workspace.metadata.dist.product]]
package = "scriptbots-app"
