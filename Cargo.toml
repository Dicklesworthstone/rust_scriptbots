[workspace]
resolver = "2"
members = [
    "crates/scriptbots-core",
    "crates/scriptbots-brain",
    "crates/scriptbots-brain-ml",
    "crates/scriptbots-brain-neuro",
    "crates/scriptbots-index",
    "crates/scriptbots-storage",
    "crates/scriptbots-render",
    "crates/scriptbots-world-gfx",
    "crates/scriptbots-app",
    "crates/scriptbots-bevy",
    "crates/scriptbots-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
authors = ["ScriptBots Team"]
description = "Evolutionary agent simulation rebuilt in modern Rust with GPUI rendering."

[workspace.dependencies]
anyhow = "1.0.93"
rayon = "1.10.0"
rand = { version = "0.9.0", features = ["small_rng"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "2.0.2"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
ordered-float = "4.2.0"
slotmap = { version = "1.0.7", features = ["serde"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
postcard = { version = "1.0.8", default-features = false, features = ["alloc", "use-std"] }
num_cpus = "1.16.0"
csv = "1.2.2"
wfc = "0.10.7"
direction = "0.18.0"
rand08 = { package = "rand", version = "0.8.5" }

duckdb = { version = "1.4.1", default-features = false, features = ["bundled"] }
fsqlite = { version = "=0.1.16", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "cd9990bb16291d8c7c247b75b47faae8d7701adb", default-features = false, features = ["native"] }
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "5f8a7413a31769e0882357f90dc424b3962ac72d" }
kira = "0.10.1"
rstar = "0.12.2"
kiddo = "4.2.0"
neuroflow = "0.2.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2.104", features = ["serde-serialize"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
incremental = false
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
split-debuginfo = "unpacked"

[profile.release-dbg]
inherits = "release"
debug = true
strip = false

[workspace.metadata.dist]
ci = ["github"]

[[workspace.metadata.dist.product]]
package = "scriptbots-app"
