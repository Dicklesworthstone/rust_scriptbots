name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Avoid cargo home pollution across jobs
  CARGO_INCREMENTAL: 0

jobs:
  # Fast format check runs first to fail early
  fmt:
    name: Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # Clippy runs on all platforms to catch platform-specific lint issues
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cargo_target: x86_64-unknown-linux-gnu
          - os: macos-14
            cargo_target: aarch64-apple-darwin
          - os: windows-2022
            cargo_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold linker and system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libfontconfig1 \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.os }}-${{ matrix.cargo_target }}
        env:
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}

      - name: Run Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}

  # Build and test on all platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cargo_target: x86_64-unknown-linux-gnu
          - os: macos-14
            cargo_target: aarch64-apple-darwin
          - os: windows-2022
            cargo_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold linker and system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libfontconfig1 \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.cargo_target }}
        env:
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}

      - name: Run tests
        run: cargo test --workspace
        env:
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}

      - name: Run scriptbots-app unit tests (terminal HUD)
        run: cargo test -p scriptbots-app --lib -- --nocapture
        env:
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}

  # Security audit for dependencies
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        # Use --ignore to skip known unmaintained packages with no security issues
        # RUSTSEC-2024-0384: instant (unmaintained, no security issue)
        # RUSTSEC-2024-0436: paste (unmaintained, no security issue)
        # RUSTSEC-2025-0052: async-std (unmaintained, no security issue)
        # RUSTSEC-2025-0141: bincode (unmaintained, no security issue)
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0052 \
            --ignore RUSTSEC-2025-0141

  wasm:
    name: Wasm (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold linker and system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libfontconfig1 \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Resolve Chromium path
        id: chromium
        run: |
          CHROMIUM_PATH=$(node - <<'NODE'
          const { chromium } = require('playwright');
          process.stdout.write(chromium.executablePath());
          NODE
          )
          echo "path=${CHROMIUM_PATH}" >> "$GITHUB_OUTPUT"

      - name: wasm-pack build (web target)
        run: wasm-pack build crates/scriptbots-web --target web --out-dir crates/scriptbots-web/web/pkg

      - name: wasm-pack test (headless Chrome)
        env:
          CHROMIUM: ${{ steps.chromium.outputs.path }}
        run: wasm-pack test --headless --chrome crates/scriptbots-web

  replay:
    name: Replay Determinism (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: replay-linux

      - name: Build scriptbots-app (release)
        run: cargo build --release -p scriptbots-app

      - name: Generate baseline replay database
        env:
          SCRIPTBOTS_MODE: terminal
          SCRIPTBOTS_TERMINAL_HEADLESS: "1"
          SCRIPTBOTS_TERMINAL_HEADLESS_FRAMES: "16"
          SCRIPTBOTS_STORAGE_PATH: ${{ github.workspace }}/ci-baseline.duckdb
        run: |
          rm -f "$SCRIPTBOTS_STORAGE_PATH"
          cargo run --release -p scriptbots-app --bin scriptbots-app -- --config ci/configs/replay_ci.toml

      - name: Generate candidate replay database
        env:
          SCRIPTBOTS_MODE: terminal
          SCRIPTBOTS_TERMINAL_HEADLESS: "1"
          SCRIPTBOTS_TERMINAL_HEADLESS_FRAMES: "16"
          SCRIPTBOTS_STORAGE_PATH: ${{ github.workspace }}/ci-candidate.duckdb
        run: |
          rm -f "$SCRIPTBOTS_STORAGE_PATH"
          cargo run --release -p scriptbots-app --bin scriptbots-app -- --config ci/configs/replay_ci.toml

      - name: Verify baseline replay determinism
        run: |
          cargo run --release -p scriptbots-app --bin scriptbots-app -- \
            --config ci/configs/replay_ci.toml \
            --replay-db ci-baseline.duckdb \
            --tick-limit 128

      - name: Compare baseline and candidate event streams
        run: |
          cargo run --release -p scriptbots-app --bin scriptbots-app -- \
            --config ci/configs/replay_ci.toml \
            --replay-db ci-baseline.duckdb \
            --compare-db ci-candidate.duckdb \
            --tick-limit 128

  render_regression:
    name: Render Regression (${{ matrix.os }})
    needs: [clippy, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect render-related changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            render:
              - 'crates/scriptbots-render/**'
              - 'crates/scriptbots-bevy/**'
              - 'docs/rendering_reference/**'
              - 'PLAN_TO_FIX_RENDERING_ISSUES.md'
              - '.github/workflows/ci.yml'

      - name: Skip render regression (no relevant changes)
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.render != 'true' }}
        run: echo "No renderer changes detected; skipping snapshot harness."

      - name: Install mold linker and system deps (Linux)
        if: ${{ matrix.os == 'ubuntu-24.04' && (github.event_name != 'pull_request' || steps.changes.outputs.render == 'true') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libfontconfig1 \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.render == 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo artifacts
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.render == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: render-${{ matrix.os }}

      - name: Run snapshot + camera invariants (Linux)
        if: ${{ matrix.os == 'ubuntu-24.04' && (github.event_name != 'pull_request' || steps.changes.outputs.render == 'true') }}
        shell: bash
        env:
          WGPU_BACKEND: gl
          WGPU_POWER_PREFERENCE: low_power
          WGPU_ALLOW_SOFTWARE: "1"
          BEVY_ASSET_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cargo test -p scriptbots-render -- --nocapture
          cargo test -p scriptbots-bevy --features bevy_render -- --nocapture

      - name: Run snapshot + camera invariants (Windows)
        if: ${{ matrix.os == 'windows-2022' && (github.event_name != 'pull_request' || steps.changes.outputs.render == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p scriptbots-render -- --nocapture

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diffs-${{ matrix.os }}
          path: target/snapshot-failures/
          retention-days: 14

  bevy_exhaustive:
    name: Bevy Exhaustive (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold linker and system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libfontconfig1 \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bevy-exhaustive-linux

      - name: Bevy exhaustive tests
        env:
          WGPU_BACKEND: gl
          WGPU_POWER_PREFERENCE: low_power
          WGPU_ALLOW_SOFTWARE: "1"
        run: |
          set -euo pipefail
          cargo test -p scriptbots-bevy --features bevy_render -- --include-ignored --nocapture
