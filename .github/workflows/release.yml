name: release-builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true
  push:
    tags:
      - "v*"

# Only allow one release build at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            dist-args: "--target x86_64-unknown-linux-gnu"
            extra-targets: ""
            build_target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: macos-universal
            dist-args: "--target aarch64-apple-darwin --target x86_64-apple-darwin"
            extra-targets: "x86_64-apple-darwin"
            apple: true
            build_target: aarch64-apple-darwin
          - os: windows-2022
            target: windows-x86_64
            dist-args: "--target x86_64-pc-windows-msvc"
            extra-targets: ""
            build_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::Release tag could not be determined."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install extra Rust targets
        if: ${{ matrix.extra-targets != '' }}
        shell: bash
        run: rustup target add ${{ matrix.extra-targets }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-${{ matrix.build_target }}
        env:
          CARGO_BUILD_TARGET: ${{ matrix.build_target }}

      - name: Install cargo-dist
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist

      - name: Generate dist manifest
        run: cargo dist manifest --tag "${{ steps.release.outputs.tag }}" --ci github
        env:
          CARGO_BUILD_TARGET: ${{ matrix.build_target }}

      - name: Build release artifacts
        shell: bash
        run: cargo dist build ${{ matrix.dist-args }} --artifacts archive --tag "${{ steps.release.outputs.tag }}" --out dist
        env:
          CARGO_BUILD_TARGET: ${{ matrix.build_target }}

      - name: Codesign macOS artifacts
        if: ${{ matrix.apple }}
        shell: bash
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_BASE64}" || -z "${MACOS_CERT_PASSWORD}" || -z "${MACOS_SIGNING_IDENTITY}" ]]; then
            echo "macOS signing secrets not provided; skipping codesign."
            exit 0
          fi

          KEYCHAIN="build-signing.keychain"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-scriptbots}"
          CERT_P12="signing-cert.p12"

          echo "$MACOS_CERT_BASE64" | base64 --decode > "$CERT_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -s "$KEYCHAIN" login.keychain

          for ARCHIVE in dist/*.tar.*; do
            TMP_DIR=$(mktemp -d)
            if [[ "$ARCHIVE" == *.tar.xz ]]; then
              tar -xJf "$ARCHIVE" -C "$TMP_DIR"
            elif [[ "$ARCHIVE" == *.tar.gz ]]; then
              tar -xzf "$ARCHIVE" -C "$TMP_DIR"
            else
              echo "Skipping unsupported archive format: $ARCHIVE"
              rm -rf "$TMP_DIR"
              continue
            fi

            APP_PATH=$(find "$TMP_DIR" -maxdepth 3 -type d -name "scriptbots-app.app" | head -n 1 || true)
            if [[ -n "$APP_PATH" ]]; then
              /usr/bin/codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
              /usr/bin/codesign --verify --deep "$APP_PATH"
            fi

            BIN_PATH=$(find "$TMP_DIR" -maxdepth 5 -type f -perm -111 -name "scriptbots-app" | head -n 1 || true)
            if [[ -n "$BIN_PATH" ]]; then
              /usr/bin/codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$BIN_PATH"
              /usr/bin/codesign --verify --deep "$BIN_PATH"
            fi

            rm "$ARCHIVE"
            (
              cd "$TMP_DIR"
              if [[ "$ARCHIVE" == *.tar.xz ]]; then
                tar -cJf "$OLDPWD/$ARCHIVE" *
              else
                tar -czf "$OLDPWD/$ARCHIVE" *
              fi
            )
            rm -rf "$TMP_DIR"
          done

          security delete-keychain "$KEYCHAIN"
          rm -f "$CERT_P12"

      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          for f in *; do
            if [[ -f "$f" ]]; then
              shasum -a 256 "$f" > "$f.sha256"
              shasum -a 512 "$f" > "$f.sha512"
            fi
          done
          # Create combined checksum files
          cat *.sha256 > checksums-sha256.txt 2>/dev/null || true
          cat *.sha512 > checksums-sha512.txt 2>/dev/null || true

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Get-ChildItem -File | ForEach-Object {
            $hash256 = (Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLower()
            $hash512 = (Get-FileHash -Algorithm SHA512 $_.Name).Hash.ToLower()
            "$hash256  $($_.Name)" | Out-File -Encoding ASCII "$($_.Name).sha256"
            "$hash512  $($_.Name)" | Out-File -Encoding ASCII "$($_.Name).sha512"
          }
          # Create combined checksum files
          Get-Content *.sha256 | Out-File -Encoding ASCII checksums-sha256.txt
          Get-Content *.sha512 | Out-File -Encoding ASCII checksums-sha512.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 30

  # Aggregate all artifacts and create combined checksums
  finalize:
    name: Finalize Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd all-artifacts
          # Remove per-platform combined files if they exist
          rm -f checksums-sha256.txt checksums-sha512.txt
          # Generate fresh combined checksums for all archives
          for f in *.tar.* *.zip; do
            if [[ -f "$f" ]]; then
              sha256sum "$f" >> SHA256SUMS.txt
              sha512sum "$f" >> SHA512SUMS.txt
            fi
          done

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: |
            all-artifacts/*.tar.*
            all-artifacts/*.zip
            all-artifacts/SHA256SUMS.txt
            all-artifacts/SHA512SUMS.txt
          retention-days: 90
