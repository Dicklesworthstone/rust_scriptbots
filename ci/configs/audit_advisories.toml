# Advisory-suppression registry — bd-2z0.8.14 (program bd-2z0.8)
#
# This file is the SINGLE SOURCE OF TRUTH for every cargo-audit suppression in
# this repository. ci/check_audit_suppressions.sh enforces, in CI:
#
#   1. Every `--ignore RUSTSEC-*` flag in .github/workflows/*.yml has exactly
#      one [[advisory]] entry here (undocumented suppression = CI failure).
#   2. Every entry here has a live `--ignore` flag (stale justification = CI
#      failure; justifications must not rot after the suppression is removed).
#   3. Every entry carries non-empty id/package/locked_version/owning_bead/
#      justification/removal_trigger/reviewed_at/reviewed_by fields.
#   4. `package` + `locked_version` must still be present in Cargo.lock
#      (suppression for an absent or silently-bumped package = CI failure;
#      a version bump without re-review is exactly the drift this gate exists
#      to catch). This also mechanically enforces the program rule that
#      suppressions for absent packages are removed, never kept "just in case".
#   5. .cargo/audit.toml must not exist: it is a second suppression channel
#      that would bypass this registry.
#
# HOW TO ADD A SUPPRESSION (discouraged; last resort only):
#   - Add the `--ignore` flag in .github/workflows/ci.yml AND one complete
#     [[advisory]] entry below in the same commit. The CI gate fails on one
#     without the other. State the exact live dependency path, why the
#     vulnerable code is unreachable or its input is fully trusted, the
#     owning bead, and the concrete condition that removes the exception.
#
# HOW TO REMOVE A SUPPRESSION (the goal):
#   - When the removal_trigger is met (e.g. a dependency release moves the
#     flagged path to a fixed version), bump the dependency through the
#     bd-2z0.8 dependency lane, delete the `--ignore` flag AND the matching
#     [[advisory]] entry in the same commit, and record the removal in the
#     owning bead.
#
# RESIDUAL-RISK TRACKING:
#   Currently no active advisory suppressions. All previous quick-xml
#   exceptions were retired under bd-2oov after wayland-scanner 0.31.11.

schema = 1
